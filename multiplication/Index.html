<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rapid Multiplication Drill</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --border-color: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-blue: #3b82f6;
            --accent-green: #22c55e;
            --accent-yellow: #eab308;
            --accent-red: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 1rem;
        }

        header {
            width: 100%;
            max-width: 1200px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 0;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 1.5rem;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.025em;
        }

        .profile-select {
            background: var(--card-bg);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            font-size: 0.9rem;
            cursor: pointer;
        }

        main {
            width: 100%;
            max-width: 1200px;
            display: grid;
            grid-template-columns: 1fr 400px;
            gap: 2rem;
        }

        @media (max-width: 900px) {
            main {
                grid-template-columns: 1fr;
            }
        }

        /* Left Column: Drill Arena */
        .drill-section {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 1rem;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            min-height: 450px;
        }

        .streak-badge {
            position: absolute;
            top: 1.5rem;
            right: 1.5rem;
            background: rgba(34, 197, 94, 0.1);
            color: var(--accent-green);
            padding: 0.35rem 0.75rem;
            border-radius: 2rem;
            font-weight: 600;
            font-size: 0.85rem;
            display: none;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .problem-display {
            font-size: 5rem;
            font-weight: 800;
            letter-spacing: -0.05em;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .answer-input-box {
            font-size: 3rem;
            font-weight: 700;
            background: var(--bg-color);
            border: 2px solid var(--accent-blue);
            color: var(--text-main);
            width: 220px;
            text-align: center;
            border-radius: 0.75rem;
            padding: 0.5rem;
            outline: none;
            margin-bottom: 1.5rem;
        }

        .numpad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.5rem;
            width: 100%;
            max-width: 280px;
        }

        .num-btn {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            font-size: 1.5rem;
            font-weight: 600;
            padding: 0.75rem 0;
            border-radius: 0.5rem;
            cursor: pointer;
            transition: background 0.1s;
        }

        .num-btn:active {
            background: var(--accent-blue);
        }

        .feedback-overlay {
            position: absolute;
            inset: 0;
            background: rgba(15, 23, 42, 0.95);
            border-radius: 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            display: none;
            z-index: 10;
        }

        .feedback-overlay.error {
            border: 3px solid var(--accent-red);
        }

        .feedback-overlay h2 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }

        .feedback-overlay p {
            font-size: 1.25rem;
            color: var(--text-muted);
            margin-bottom: 1.5rem;
        }

        .retry-input {
            font-size: 2.5rem;
            font-weight: 700;
            background: var(--bg-color);
            border: 2px solid var(--accent-red);
            color: var(--text-main);
            width: 180px;
            text-align: center;
            border-radius: 0.5rem;
            padding: 0.25rem;
            outline: none;
        }

        /* Right Column: Grid Dashboard */
        .dashboard-section {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 1rem;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
        }

        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .dashboard-header h3 {
            font-size: 1.1rem;
            font-weight: 600;
        }

        .settings-toggle {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.85rem;
            text-decoration: underline;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(11, 1fr);
            gap: 4px;
            align-items: center;
            justify-items: center;
            margin-bottom: 1.5rem;
        }

        .grid-label {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .grid-cell {
            width: 100%;
            aspect-ratio: 1;
            max-width: 32px;
            cursor: pointer;
            transition: transform 0.1s;
        }

        .grid-cell:hover {
            transform: scale(1.15);
        }

        .grid-cell.disabled {
            opacity: 0.15;
            pointer-events: none;
        }

        /* Settings Panel */
        .settings-panel {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 0.75rem;
            padding: 1rem;
            margin-top: auto;
        }

        .settings-panel h4 {
            font-size: 0.9rem;
            margin-bottom: 0.75rem;
        }

        .table-toggles {
            display: flex;
            flex-wrap: wrap;
            gap: 0.35rem;
            margin-bottom: 1rem;
        }

        .table-chip {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 0.25rem 0.5rem;
            border-radius: 0.3rem;
            font-size: 0.75rem;
            cursor: pointer;
        }

        .table-chip.active {
            background: var(--accent-blue);
            color: white;
            border-color: var(--accent-blue);
        }

        .speed-setting {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .speed-setting select {
            background: var(--card-bg);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 0.25rem 0.5rem;
            border-radius: 0.3rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>⚡ Multiplication Flash Drill</h1>
        <select class="profile-select" id="profileSelect" onchange="switchProfile()">
            <option value="Child1">Child 1</option>
            <option value="Child2">Child 2</option>
            <option value="Child3">Child 3</option>
        </select>
    </header>

    <main>
        <!-- Drill Arena -->
        <section class="drill-section" id="drillSection">
            <div class="streak-badge" id="streakBadge">🔥 <span id="streakCount">0</span> Streak</div>
            
            <div class="problem-display">
                <span id="numA">7</span> × <span id="numB">8</span> =
            </div>

            <input type="text" id="answerInput" class="answer-input-box" inputmode="none" autocomplete="off" autofocus>

            <div class="numpad">
                <button class="num-btn" onclick="pressKey('1')">1</button>
                <button class="num-btn" onclick="pressKey('2')">2</button>
                <button class="num-btn" onclick="pressKey('3')">3</button>
                <button class="num-btn" onclick="pressKey('4')">4</button>
                <button class="num-btn" onclick="pressKey('5')">5</button>
                <button class="num-btn" onclick="pressKey('6')">6</button>
                <button class="num-btn" onclick="pressKey('7')">7</button>
                <button class="num-btn" onclick="pressKey('8')">8</button>
                <button class="num-btn" onclick="pressKey('9')">9</button>
                <button class="num-btn" onclick="pressKey('C')">C</button>
                <button class="num-btn" onclick="pressKey('0')">0</button>
                <button class="num-btn" onclick="pressKey('OK')">↵</button>
            </div>

            <!-- Error Feedback Overlay -->
            <div class="feedback-overlay" id="feedbackOverlay">
                <h2 id="errorCorrectionPrompt">Not quite!</h2>
                <p>Type the correct answer to continue:</p>
                <input type="text" id="retryInput" class="retry-input" inputmode="none" autocomplete="off">
            </div>
        </section>

        <!-- Dashboard Section -->
        <section class="dashboard-section">
            <div class="dashboard-header">
                <h3>Mastery Map (10x10)</h3>
                <button class="settings-toggle" onclick="toggleSettings()">Toggle Tables</button>
            </div>

            <div class="grid-container" id="gridContainer">
                <!-- Dynamically generated via JS -->
            </div>

            <div class="settings-panel" id="settingsPanel" style="display: none;">
                <h4>Active Multiplication Tables</h4>
                <div class="table-toggles" id="tableToggles">
                    <!-- Table Chips 1-10 -->
                </div>
                <div class="speed-setting">
                    <span>Mastery Speed Target:</span>
                    <select id="speedTargetSelect" onchange="updateSpeedTarget()">
                        <option value="1.5">Fast (&lt; 1.5s)</option>
                        <option value="2.0" selected>Normal (&lt; 2.0s)</option>
                        <option value="3.0">Relaxed (&lt; 3.0s)</option>
                    </select>
                </div>
            </div>
        </section>
    </main>

    <script>
        // State Management & Storage
        let currentProfile = 'Child1';
        let maxTable = 10;
        let speedThreshold = 2.0; // seconds
        let activeTables = Array.from({length: 10}, (_, i) => i + 1);
        
        // Data structure: stats['7_8'] = { attempts: [{correct: true, speed: 1.2}, ...] (max 5) }
        let stats = {};
        
        let currentPair = { a: 2, b: 3 };
        let startTime = Date.now();
        let currentStreak = 0;
        let lastAskedPair = null;
        let awaitingCorrection = false;
        let expectedAnswer = 0;

        function initApp() {
            loadProfileData();
            buildTableToggles();
            renderGrid();
            nextQuestion();
        }

        function loadProfileData() {
            currentProfile = document.getElementById('profileSelect').value;
            const saved = localStorage.getItem('mult_app_' + currentProfile);
            if (saved) {
                const data = JSON.parse(saved);
                stats = data.stats || {};
                activeTables = data.activeTables || Array.from({length: 10}, (_, i) => i + 1);
                speedThreshold = data.speedThreshold || 2.0;
                document.getElementById('speedTargetSelect').value = speedThreshold;
            } else {
                stats = {};
                activeTables = Array.from({length: 10}, (_, i) => i + 1);
                for (let i = 1; i <= 10; i++) {
                    for (let j = 1; j <= 10; j++) {
                        stats[`${i}_${j}`] = { attempts: [] };
                    }
                }
                saveProfileData();
            }
        }

        function saveProfileData() {
            const data = { stats, activeTables, speedThreshold };
            localStorage.setItem('mult_app_' + currentProfile, JSON.stringify(data));
        }

        function switchProfile() {
            loadProfileData();
            renderGrid();
            nextQuestion();
        }

        function toggleSettings() {
            const panel = document.getElementById('settingsPanel');
            panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
        }

        function buildTableToggles() {
            const container = document.getElementById('tableToggles');
            container.innerHTML = '';
            for (let i = 1; i <= 10; i++) {
                const chip = document.createElement('div');
                chip.className = `table-chip ${activeTables.includes(i) ? 'active' : ''}`;
                chip.innerText = `${i}s`;
                chip.onclick = () => toggleTableActive(i);
                container.appendChild(chip);
            }
        }

        function toggleTableActive(num) {
            if (activeTables.includes(num)) {
                if (activeTables.length === 1) return; // Keep at least one
                activeTables = activeTables.filter(t => t !== num);
            } else {
                activeTables.push(num);
                activeTables.sort((a,b) => a - b);
            }
            saveProfileData();
            buildTableToggles();
            renderGrid();
            nextQuestion();
        }

        function updateSpeedTarget() {
            speedThreshold = parseFloat(document.getElementById('speedTargetSelect').value);
            saveProfileData();
        }

        // Render 10x10 Grid with 5-Sector Pie Chart SVGs
        function renderGrid() {
            const container = document.getElementById('gridContainer');
            container.innerHTML = '';

            // Top-left blank corner label
            const corner = document.createElement('div');
            corner.className = 'grid-label';
            container.appendChild(corner);

            // Column headers
            for (let c = 1; c <= 10; c++) {
                const lbl = document.createElement('div');
                lbl.className = 'grid-label';
                lbl.innerText = c;
                container.appendChild(lbl);
            }

            // Rows
            for (let r = 1; r <= 10; r++) {
                // Row label
                const rowLbl = document.createElement('div');
                rowLbl.className = 'grid-label';
                rowLbl.innerText = r;
                container.appendChild(rowLbl);

                for (let c = 1; c <= 10; c++) {
                    const cell = document.createElement('div');
                    const key = `${r}_${c}`;
                    const isDisabled = !activeTables.includes(r) || !activeTables.includes(c);
                    
                    cell.className = `grid-cell ${isDisabled ? 'disabled' : ''}`;
                    cell.innerHTML = createPieSvg(stats[key] ? stats[key].attempts : []);
                    container.appendChild(cell);
                }
            }
        }

        // Generate 5-slice SVG pie chart
        function createPieSvg(attempts) {
            let svg = `<svg viewBox="0 0 32 32" width="100%" height="100%">`;
            svg += `<circle cx="16" cy="16" r="15" fill="none" stroke="#334155" stroke-width="2"/>`;

            const totalSectors = 5;
            for (let i = 0; i < totalSectors; i++) {
                const attempt = attempts[i];
                let color = 'none';
                let strokeColor = '#ffffff'; // white/silver outline for empty slots

                if (attempt) {
                    strokeColor = 'transparent';
                    if (attempt.correct && attempt.speed <= speedThreshold) {
                        color = '#22c55e'; // Green
                    } else if (attempt.correct) {
                        color = '#eab308'; // Yellow
                    } else {
                        color = '#ef4444'; // Red
                    }
                }

                // Draw sector arc if present, or hollow ring slot
                if (color !== 'none') {
                    svg += getPieSlicePath(i, totalSectors, color);
                } else {
                    svg += getPieSliceOutline(i, totalSectors, strokeColor);
                }
            }
            svg += `</svg>`;
            return svg;
        }

        function getPieSlicePath(index, total, color) {
            const angleSize = 360 / total;
            const startAngle = index * angleSize - 90;
            const endAngle = (index + 1) * angleSize - 90;
            
            const x1 = 16 + 15 * Math.cos(Math.PI * startAngle / 180);
            const y1 = 16 + 15 * Math.sin(Math.PI * startAngle / 180);
            const x2 = 16 + 15 * Math.cos(Math.PI * endAngle / 180);
            const y2 = 16 + 15 * Math.sin(Math.PI * endAngle / 180);

            const largeArc = angleSize > 180 ? 1 : 0;
            const pathData = `M 16 16 L ${x1} ${y1} A 15 15 0 ${largeArc} 1 ${x2} ${y2} Z`;
            return `<path d="${pathData}" fill="${color}" stroke="#1e293b" stroke-width="0.5"/>`;
        }

        function getPieSliceOutline(index, total, strokeColor) {
            const angleSize = 360 / total;
            const startAngle = index * angleSize - 90;
            const endAngle = (index + 1) * angleSize - 90;
            
            const x1 = 16 + 15 * Math.cos(Math.PI * startAngle / 180);
            const y1 = 16 + 15 * Math.sin(Math.PI * startAngle / 180);
            const x2 = 16 + 15 * Math.cos(Math.PI * endAngle / 180);
            const y2 = 16 + 15 * Math.sin(Math.PI * endAngle / 180);

            const largeArc = angleSize > 180 ? 1 : 0;
            const pathData = `M 16 16 L ${x1} ${y1} A 15 15 0 ${largeArc} 1 ${x2} ${y2} Z`;
            return `<path d="${pathData}" fill="rgba(255,255,255,0.05)" stroke="${strokeColor}" stroke-width="1"/>`;
        }

        // Adaptive Engine: Pick next question with 80/20 split & anti-spam cooldown
        function nextQuestion() {
            let pool = [];
            for (let r of activeTables) {
                for (let c of activeTables) {
                    pool.push({a: r, b: c});
                }
            }

            // Categorize unmastered vs mastered
            let unmastered = [];
            let mastered = [];

            pool.forEach(pair => {
                const key = `${pair.a}_${pair.b}`;
                const attempts = stats[key] ? stats[key].attempts : [];
                
                // Mastered definition: Last 5 attempts all correct and fast
                const isMastered = attempts.length === 5 && attempts.every(att => att.correct && att.speed <= speedThreshold);
                
                if (isMastered) {
                    mastered.push(pair);
                } else {
                    unmastered.push(pair);
                }
            });

            // 80/20 selection with anti-spam cooldown
            let selected;
            const useMasteredReview = mastered.length > 0 && (unmastered.length === 0 || Math.random() < 0.2);

            let candidatePool = useMasteredReview ? mastered : unmastered;
            if (candidatePool.length === 0) candidatePool = pool;

            // Filter out immediate last asked pair (anti-spam cooldown)
            let filteredPool = candidatePool.filter(p => !(lastAskedPair && p.a === lastAskedPair.a && p.b === lastAskedPair.b));
            if (filteredPool.length === 0) filteredPool = candidatePool;

            selected = filteredPool[Math.floor(Math.random() * filteredPool.length)];

            lastAskedPair = selected;
            currentPair = selected;
            expectedAnswer = currentPair.a * currentPair.b;

            document.getElementById('numA').innerText = currentPair.a;
            document.getElementById('numB').innerText = currentPair.b;
            document.getElementById('answerInput').value = '';
            startTime = Date.now();
        }

        // Input & Evaluation Handling
        const answerInput = document.getElementById('answerInput');
        const retryInput = document.getElementById('retryInput');

        function pressKey(val) {
            if (awaitingCorrection) {
                handleCorrectionInput(val);
                return;
            }

            if (val === 'C') {
                answerInput.value = '';
            } else if (val === 'OK') {
                checkAnswer(answerInput.value);
            } else {
                answerInput.value += val;
                // Auto-submit when length matches expected answer length
                if (answerInput.value.length >= String(expectedAnswer).length) {
                    checkAnswer(answerInput.value);
                }
            }
        }

        // Physical Keyboard Support
        window.addEventListener('keydown', (e) => {
            if (e.key >= '0' && e.key <= '9') {
                pressKey(e.key);
            } else if (e.key === 'Backspace') {
                if (awaitingCorrection) {
                    retryInput.value = retryInput.value.slice(0, -1);
                } else {
                    answerInput.value = answerInput.value.slice(0, -1);
                }
            } else if (e.key === 'Enter') {
                if (awaitingCorrection) {
                    handleCorrectionInput('OK');
                } else {
                    checkAnswer(answerInput.value);
                }
            }
        });

        function checkAnswer(valStr) {
            if (!valStr) return;
            const userAns = parseInt(valStr, 10);
            const elapsed = (Date.now() - startTime) / 1000;
            const isCorrect = (userAns === expectedAnswer);

            const key = `${currentPair.a}_${currentPair.b}`;
            if (!stats[key]) stats[key] = { attempts: [] };
            
            // Sliding window: keep max 5
            stats[key].attempts.push({ correct: isCorrect, speed: elapsed });
            if (stats[key].attempts.length > 5) {
                stats[key].attempts.shift();
            }

            saveProfileData();
            renderGrid();

            if (isCorrect) {
                currentStreak++;
                updateStreakUI();
                nextQuestion();
            } else {
                currentStreak = 0;
                updateStreakUI();
                triggerErrorFlow();
            }
        }

        function updateStreakUI() {
            const badge = document.getElementById('streakBadge');
            const count = document.getElementById('streakCount');
            if (currentStreak >= 3) {
                badge.style.display = 'block';
                count.innerText = currentStreak;
            } else {
                badge.style.display = 'none';
            }
        }

        function triggerErrorFlow() {
            awaitingCorrection = true;
            retryInput.value = '';
            document.getElementById('errorCorrectionPrompt').innerText = `Incorrect! ${currentPair.a} × ${currentPair.b} = ${expectedAnswer}`;
            document.getElementById('feedbackOverlay').style.display = 'flex';
            retryInput.focus();
        }

        function handleCorrectionInput(val) {
            if (val === 'C') {
                retryInput.value = '';
            } else if (val === 'OK' || retryInput.value.length >= String(expectedAnswer).length) {
                if (parseInt(retryInput.value, 10) === expectedAnswer) {
                    document.getElementById('feedbackOverlay').style.display = 'none';
                    awaitingCorrection = false;
                    answerInput.focus();
                    nextQuestion();
                } else {
                    retryInput.value = '';
                }
            } else if (val >= '0' && val <= '9') {
                retryInput.value += val;
                if (retryInput.value.length >= String(expectedAnswer).length) {
                    handleCorrectionInput('OK');
                }
            }
        }

        // Initialize on load
        window.onload = initApp;
    </script>
</body>
</html>
