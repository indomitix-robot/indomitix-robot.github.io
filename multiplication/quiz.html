<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rapid Multiplication Drill</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --border-color: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-blue: #3b82f6;
            --accent-green: #22c55e;
            --accent-yellow: #eab308;
            --accent-red: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 1rem;
        }

        header {
            width: 100%;
            max-width: 1200px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 0;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 1.5rem;
        }

        h1 {
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: -0.025em;
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 0.4rem 0.8rem;
            border-radius: 0.5rem;
        }

        .user-name-input {
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 0.95rem;
            font-weight: 600;
            width: 110px;
            outline: none;
        }

        main {
            width: 100%;
            max-width: 1200px;
            display: grid;
            grid-template-columns: 1fr 440px;
            gap: 2rem;
        }

        @media (max-width: 900px) {
            main {
                grid-template-columns: 1fr;
            }
        }

        /* Drill Arena */
        .drill-section {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 1rem;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            min-height: 480px;
        }

        .streak-badge {
            position: absolute;
            top: 1.5rem;
            right: 1.5rem;
            background: rgba(34, 197, 94, 0.1);
            color: var(--accent-green);
            padding: 0.35rem 0.75rem;
            border-radius: 2rem;
            font-weight: 600;
            font-size: 0.85rem;
            display: none;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .problem-display {
            font-size: 5rem;
            font-weight: 800;
            letter-spacing: -0.05em;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .error-message {
            color: var(--accent-red);
            font-size: 1.1rem;
            font-weight: 600;
            min-height: 1.5rem;
            margin-bottom: 0.75rem;
            text-align: center;
        }

        .answer-input-box {
            font-size: 3rem;
            font-weight: 700;
            background: var(--bg-color);
            border: 2px solid var(--accent-blue);
            color: var(--text-main);
            width: 220px;
            text-align: center;
            border-radius: 0.75rem;
            padding: 0.5rem;
            outline: none;
            margin-bottom: 1.5rem;
            transition: border-color 0.2s;
        }

        .answer-input-box.error-state {
            border-color: var(--accent-red);
            background: rgba(239, 68, 68, 0.1);
        }

        .numpad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.5rem;
            width: 100%;
            max-width: 280px;
        }

        .num-btn {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            font-size: 1.5rem;
            font-weight: 600;
            padding: 0.75rem 0;
            border-radius: 0.5rem;
            cursor: pointer;
            transition: background 0.1s;
        }

        .num-btn:active {
            background: var(--accent-blue);
        }

        /* Dashboard Section */
        .dashboard-section {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 1rem;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
        }

        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .dashboard-header h3 {
            font-size: 1.1rem;
            font-weight: 600;
        }

        .settings-toggle {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.85rem;
            text-decoration: underline;
        }

        .grid-container {
            display: grid;
            grid-template-columns: 36px repeat(10, 1fr);
            gap: 4px;
            align-items: center;
            justify-items: center;
            margin-bottom: 1.5rem;
        }

        .grid-label {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .row-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            line-height: 1.1;
        }

        .row-title {
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .row-speed-badge {
            font-size: 0.62rem;
            font-weight: 600;
            color: var(--accent-blue);
        }

        .grid-cell {
            width: 100%;
            aspect-ratio: 1;
            max-width: 32px;
            cursor: pointer;
            transition: transform 0.1s;
        }

        .grid-cell:hover {
            transform: scale(1.15);
        }

        .grid-cell.disabled {
            opacity: 0.15;
            pointer-events: none;
        }

        /* Settings Panel */
        .settings-panel {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 0.75rem;
            padding: 1rem;
            margin-top: auto;
        }

        .settings-panel h4 {
            font-size: 0.9rem;
            margin-bottom: 0.75rem;
        }

        .table-toggles {
            display: flex;
            flex-wrap: wrap;
            gap: 0.35rem;
            margin-bottom: 1.25rem;
        }

        .table-chip {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 0.25rem 0.5rem;
            border-radius: 0.3rem;
            font-size: 0.75rem;
            cursor: pointer;
        }

        .table-chip.active {
            background: var(--accent-blue);
            color: white;
            border-color: var(--accent-blue);
        }

        .speed-control {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .speed-label-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .speed-slider {
            width: 100%;
            accent-color: var(--accent-blue);
            cursor: pointer;
        }
    </style>
</head>
<body>

    <header>
        <h1>⚡ Multiplication Flash Drill</h1>
        <div class="user-profile">
            <span>👤</span>
            <input type="text" id="userNameInput" class="user-name-input" value="Student" onchange="saveUserData()">
        </div>
    </header>

    <main>
        <!-- Drill Arena -->
        <section class="drill-section" id="drillSection">
            <div class="streak-badge" id="streakBadge">🔥 <span id="streakCount">0</span> Streak</div>
            
            <div class="problem-display">
                <span id="numA">7</span> × <span id="numB">8</span> =
            </div>

            <div class="error-message" id="errorMessage"></div>

            <input type="text" id="answerInput" class="answer-input-box" inputmode="none" autocomplete="off" autofocus readonly>

            <div class="numpad">
                <button class="num-btn" onclick="pressKey('1')">1</button>
                <button class="num-btn" onclick="pressKey('2')">2</button>
                <button class="num-btn" onclick="pressKey('3')">3</button>
                <button class="num-btn" onclick="pressKey('4')">4</button>
                <button class="num-btn" onclick="pressKey('5')">5</button>
                <button class="num-btn" onclick="pressKey('6')">6</button>
                <button class="num-btn" onclick="pressKey('7')">7</button>
                <button class="num-btn" onclick="pressKey('8')">8</button>
                <button class="num-btn" onclick="pressKey('9')">9</button>
                <button class="num-btn" onclick="pressKey('C')">C</button>
                <button class="num-btn" onclick="pressKey('0')">0</button>
                <button class="num-btn" onclick="pressKey('OK')">↵</button>
            </div>
        </section>

        <!-- Dashboard Section -->
        <section class="dashboard-section">
            <div class="dashboard-header">
                <h3>Mastery Map (10x10)</h3>
                <button class="settings-toggle" onclick="toggleSettings()">Toggle Tables</button>
            </div>

            <div class="grid-container" id="gridContainer">
                <!-- Dynamically generated via JS -->
            </div>

            <div class="settings-panel" id="settingsPanel" style="display: none;">
                <h4>Active Multiplication Tables</h4>
                <div class="table-toggles" id="tableToggles">
                    <!-- Table Chips 1-10 -->
                </div>
                <div class="speed-control">
                    <div class="speed-label-row">
                        <span>Speed Target:</span>
                        <strong id="speedValueDisplay" style="color: var(--text-main);">2.0s</strong>
                    </div>
                    <input type="range" id="speedSlider" class="speed-slider" min="0.5" max="4.0" step="0.1" value="2.0" oninput="updateSpeedTarget(this.value)">
                </div>
            </div>
        </section>
    </main>

    <script>
        let userName = 'Student';
        let speedThreshold = 2.0; // seconds
        let activeTables = Array.from({length: 10}, (_, i) => i + 1);
        let stats = {};
        
        let currentPair = { a: 2, b: 3 };
        let startTime = Date.now();
        let currentStreak = 0;
        let lastAskedPair = null;
        let awaitingCorrection = false;
        let expectedAnswer = 0;

        function initApp() {
            loadUserData();
            buildTableToggles();
            renderGrid();
            nextQuestion();
        }

        function loadUserData() {
            const saved = localStorage.getItem('mult_app_user_data');
            if (saved) {
                const data = JSON.parse(saved);
                userName = data.userName || 'Student';
                stats = data.stats || {};
                activeTables = data.activeTables || Array.from({length: 10}, (_, i) => i + 1);
                speedThreshold = data.speedThreshold || 2.0;
            } else {
                stats = {};
                activeTables = Array.from({length: 10}, (_, i) => i + 1);
                for (let i = 1; i <= 10; i++) {
                    for (let j = 1; j <= 10; j++) {
                        stats[`${i}_${j}`] = { attempts: [] };
                    }
                }
                saveUserData();
            }
            document.getElementById('userNameInput').value = userName;
            document.getElementById('speedSlider').value = speedThreshold;
            document.getElementById('speedValueDisplay').innerText = speedThreshold.toFixed(1) + 's';
        }

        function saveUserData() {
            userName = document.getElementById('userNameInput').value || 'Student';
            const data = { userName, stats, activeTables, speedThreshold };
            localStorage.setItem('mult_app_user_data', JSON.stringify(data));
        }

        function toggleSettings() {
            const panel = document.getElementById('settingsPanel');
            panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
        }

        function buildTableToggles() {
            const container = document.getElementById('tableToggles');
            container.innerHTML = '';
            for (let i = 1; i <= 10; i++) {
                const chip = document.createElement('div');
                chip.className = `table-chip ${activeTables.includes(i) ? 'active' : ''}`;
                chip.innerText = `${i}s`;
                chip.onclick = () => toggleTableActive(i);
                container.appendChild(chip);
            }
        }

        function toggleTableActive(num) {
            if (activeTables.includes(num)) {
                if (activeTables.length === 1) return;
                activeTables = activeTables.filter(t => t !== num);
            } else {
                activeTables.push(num);
                activeTables.sort((a,b) => a - b);
            }
            saveUserData();
            buildTableToggles();
            renderGrid();
            nextQuestion();
        }

        function updateSpeedTarget(val) {
            speedThreshold = parseFloat(val);
            document.getElementById('speedValueDisplay').innerText = speedThreshold.toFixed(1) + 's';
            saveUserData();
        }

        // Calculate Row Average Speed for Correct Answers
        function getRowAverageSpeed(rowNum) {
            let totalSpeed = 0;
            let count = 0;

            for (let c = 1; c <= 10; c++) {
                const key = `${rowNum}_${c}`;
                if (stats[key] && stats[key].attempts) {
                    stats[key].attempts.forEach(att => {
                        if (att.correct) {
                            totalSpeed += att.speed;
                            count++;
                        }
                    });
                }
            }

            return count > 0 ? (totalSpeed / count).toFixed(1) + 's' : '--';
        }

        // Render 10x10 Grid with 5-Sector Pie Chart SVGs
        function renderGrid() {
            const container = document.getElementById('gridContainer');
            container.innerHTML = '';

            const corner = document.createElement('div');
            corner.className = 'grid-label';
            container.appendChild(corner);

            // Column headers
            for (let c = 1; c <= 10; c++) {
                const lbl = document.createElement('div');
                lbl.className = 'grid-label';
                lbl.innerText = c;
                container.appendChild(lbl);
            }

            // Rows
            for (let r = 1; r <= 10; r++) {
                const rowLbl = document.createElement('div');
                rowLbl.className = 'grid-label row-header';
                
                const avgSpeed = getRowAverageSpeed(r);
                rowLbl.innerHTML = `
                    <span class="row-title">${r}</span>
                    <span class="row-speed-badge">${avgSpeed}</span>
                `;
                container.appendChild(rowLbl);

                for (let c = 1; c <= 10; c++) {
                    const cell = document.createElement('div');
                    const key = `${r}_${c}`;
                    
                    const isActive = activeTables.includes(r);
                    
                    cell.className = `grid-cell ${!isActive ? 'disabled' : ''}`;
                    cell.innerHTML = createPieSvg(stats[key] ? stats[key].attempts : []);
                    container.appendChild(cell);
                }
            }
        }

        function createPieSvg(attempts) {
            let svg = `<svg viewBox="0 0 32 32" width="100%" height="100%">`;
            svg += `<circle cx="16" cy="16" r="15" fill="none" stroke="#334155" stroke-width="2"/>`;

            const totalSectors = 5;
            for (let i = 0; i < totalSectors; i++) {
                const attempt = attempts[i];
                let color = 'none';
                let strokeColor = '#ffffff';

                if (attempt) {
                    strokeColor = 'transparent';
                    if (attempt.correct && attempt.speed <= speedThreshold) {
                        color = '#22c55e'; // Green
                    } else if (attempt.correct) {
                        color = '#eab308'; // Yellow
                    } else {
                        color = '#ef4444'; // Red
                    }
                }

                if (color !== 'none') {
                    svg += getPieSlicePath(i, totalSectors, color);
                } else {
                    svg += getPieSliceOutline(i, totalSectors, strokeColor);
                }
            }
            svg += `</svg>`;
            return svg;
        }

        function getPieSlicePath(index, total, color) {
            const angleSize = 360 / total;
            const startAngle = index * angleSize - 90;
            const endAngle = (index + 1) * angleSize - 90;
            
            const x1 = 16 + 15 * Math.cos(Math.PI * startAngle / 180);
            const y1 = 16 + 15 * Math.sin(Math.PI * startAngle / 180);
            const x2 = 16 + 15 * Math.cos(Math.PI * endAngle / 180);
            const y2 = 16 + 15 * Math.sin(Math.PI * endAngle / 180);

            const largeArc = angleSize > 180 ? 1 : 0;
            const pathData = `M 16 16 L ${x1} ${y1} A 15 15 0 ${largeArc} 1 ${x2} ${y2} Z`;
            return `<path d="${pathData}" fill="${color}" stroke="#1e293b" stroke-width="0.5"/>`;
        }

        function getPieSliceOutline(index, total, strokeColor) {
            const angleSize = 360 / total;
            const startAngle = index * angleSize - 90;
            const endAngle = (index + 1) * angleSize - 90;
            
            const x1 = 16 + 15 * Math.cos(Math.PI * startAngle / 180);
            const y1 = 16 + 15 * Math.sin(Math.PI * startAngle / 180);
            const x2 = 16 + 15 * Math.cos(Math.PI * endAngle / 180);
            const y2 = 16 + 15 * Math.sin(Math.PI * endAngle / 180);

            const largeArc = angleSize > 180 ? 1 : 0;
            const pathData = `M 16 16 L ${x1} ${y1} A 15 15 0 ${largeArc} 1 ${x2} ${y2} Z`;
            return `<path d="${pathData}" fill="rgba(255,255,255,0.05)" stroke="${strokeColor}" stroke-width="1"/>`;
        }

        // Adaptive Engine: Pick pairs where row 'r' is in activeTables
        function nextQuestion() {
            let pool = [];
            for (let r = 1; r <= 10; r++) {
                if (activeTables.includes(r)) {
                    for (let c = 1; c <= 10; c++) {
                        pool.push({a: r, b: c});
                    }
                }
            }

            let unmastered = [];
            let mastered = [];

            pool.forEach(pair => {
                const key = `${pair.a}_${pair.b}`;
                const attempts = stats[key] ? stats[key].attempts : [];
                
                const isMastered = attempts.length === 5 && attempts.every(att => att.correct && att.speed <= speedThreshold);
                
                if (isMastered) {
                    mastered.push(pair);
                } else {
                    unmastered.push(pair);
                }
            });

            let selected;
            const useMasteredReview = mastered.length > 0 && (unmastered.length === 0 || Math.random() < 0.2);

            let candidatePool = useMasteredReview ? mastered : unmastered;
            if (candidatePool.length === 0) candidatePool = pool;

            let filteredPool = candidatePool.filter(p => !(lastAskedPair && p.a === lastAskedPair.a && p.b === lastAskedPair.b));
            if (filteredPool.length === 0) filteredPool = candidatePool;

            selected = filteredPool[Math.floor(Math.random() * filteredPool.length)];

            lastAskedPair = selected;
            currentPair = selected;
            expectedAnswer = currentPair.a * currentPair.b;

            document.getElementById('numA').innerText = currentPair.a;
            document.getElementById('numB').innerText = currentPair.b;
            
            awaitingCorrection = false;
            document.getElementById('errorMessage').innerText = '';
            const input = document.getElementById('answerInput');
            input.value = '';
            input.classList.remove('error-state');
            
            startTime = Date.now();
        }

        const answerInput = document.getElementById('answerInput');

        function pressKey(val) {
            if (val === 'C') {
                answerInput.value = '';
            } else if (val === 'OK') {
                checkAnswer(answerInput.value);
            } else {
                answerInput.value += val;
                if (answerInput.value.length >= String(expectedAnswer).length) {
                    checkAnswer(answerInput.value);
                }
            }
        }

        window.addEventListener('keydown', (e) => {
            if (e.key >= '0' && e.key <= '9') {
                pressKey(e.key);
            } else if (e.key === 'Backspace') {
                answerInput.value = answerInput.value.slice(0, -1);
            } else if (e.key === 'Enter') {
                checkAnswer(answerInput.value);
            }
        });

        function checkAnswer(valStr) {
            if (!valStr) return;
            const userAns = parseInt(valStr, 10);
            
            if (awaitingCorrection) {
                if (userAns === expectedAnswer) {
                    nextQuestion();
                } else {
                    answerInput.value = '';
                }
                return;
            }

            const elapsed = (Date.now() - startTime) / 1000;
            const isCorrect = (userAns === expectedAnswer);

            const key = `${currentPair.a}_${currentPair.b}`;
            if (!stats[key]) stats[key] = { attempts: [] };
            
            stats[key].attempts.push({ correct: isCorrect, speed: elapsed });
            if (stats[key].attempts.length > 5) {
                stats[key].attempts.shift();
            }

            saveUserData();
            renderGrid();

            if (isCorrect) {
                currentStreak++;
                updateStreakUI();
                nextQuestion();
            } else {
                currentStreak = 0;
                updateStreakUI();
                triggerErrorFlow();
            }
        }

        function updateStreakUI() {
            const badge = document.getElementById('streakBadge');
            const count = document.getElementById('streakCount');
            if (currentStreak >= 3) {
                badge.style.display = 'block';
                count.innerText = currentStreak;
            } else {
                badge.style.display = 'none';
            }
        }

        function triggerErrorFlow() {
            awaitingCorrection = true;
            answerInput.value = '';
            answerInput.classList.add('error-state');
            document.getElementById('errorMessage').innerText = `Incorrect! Type ${expectedAnswer} to continue`;
        }

        window.onload = initApp;
    </script>
</body>
</html>
